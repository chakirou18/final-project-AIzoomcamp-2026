receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 80
    spike_limit_mib: 16
  batch:
    timeout: 500ms
    send_batch_size: 64
    send_batch_max_size: 128
exporters:
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    timeout: 2s
    sending_queue:
      queue_size: 256
      num_consumers: 1
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/jaeger]
  telemetry:
    logs:
      level: warn
