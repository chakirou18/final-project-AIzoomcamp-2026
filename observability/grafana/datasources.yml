apiVersion: 1
datasources:
  - name: Prometheus
    uid: fieldops-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: fieldops-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 100
      derivedFields:
        - name: trace_id
          datasourceUid: fieldops-jaeger
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          urlDisplayLabel: View Jaeger trace
  - name: Jaeger
    uid: fieldops-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
