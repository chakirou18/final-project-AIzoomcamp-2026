global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: fieldops-web
    scrape_timeout: 4s
    static_configs:
      - targets: [web:8000]
        labels:
          service: fieldops-web
          environment: local
# T10 owns alert rules. Alertmanager is provisioned but has no incident receiver.
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
