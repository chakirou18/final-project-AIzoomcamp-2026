        {
          "eval_time": "10s",
          "alertname": "NotificationScrapeFailure",
          "exp_alerts": []
        },
        {
          "eval_time": "15s",
          "alertname": "NotificationScrapeFailure",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "critical",
                "service": "fieldops-web",
                "environment": "local"
              },
              "exp_annotations": {
                "summary": "Notification scrape unavailable",
                "description": "The application metrics target is down or absent. Delivery state is unknown."
              }
            }
          ]
        },
        {
          "eval_time": "30s",
          "alertname": "NotificationMetricsMissing",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "absent target",
      "interval": "5s",
      "input_series": [],
