auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: fieldops_
        period: 24h
compactor:
  working_directory: /loki/compactor
  compaction_interval: 1m
  retention_enabled: true
  retention_delete_delay: 2m
  retention_delete_worker_count: 1
  delete_request_store: filesystem
limits_config:
  retention_period: 24h
  ingestion_rate_mb: 0.05
  ingestion_burst_size_mb: 1
  max_streams_per_user: 16
  max_global_streams_per_user: 16
  max_query_length: 15m
  max_query_parallelism: 2
  max_entries_limit_per_query: 500
  split_queries_by_interval: 5m
  reject_old_samples: true
  reject_old_samples_max_age: 24h
ingester:
  chunk_idle_period: 1m
  max_chunk_age: 1h
  wal:
    checkpoint_duration: 1m
    replay_memory_ceiling: 64MB
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: false
analytics:
  reporting_enabled: false
