# Private model runtime shared by the development and production agents on one host.
# Separate Compose project; its network is internal (no route to or from the Internet) and no
# port is published, so only containers explicitly attached to `fieldops-model` can reach it.
#
#   docker compose -f docker-compose.model.yml up -d --wait
#
# One-time model download (needs egress, so it runs in a temporary container on the default
# bridge and writes into the same volume; nothing is published):
#   docker run -d --name fieldops-model-pull -v fieldops-model_ollama_models:/root/.ollama \
#     ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
#   docker exec fieldops-model-pull ollama pull llama3.2:3b && docker stop fieldops-model-pull && docker rm fieldops-model-pull

name: fieldops-model

services:
  ollama:
    # Same Ollama release as the locally validated T11 real-model run.
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NOPRUNE: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks: [model]
    mem_limit: 4g
    cpus: 4
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

networks:
  model:
    name: fieldops-model
    internal: true

volumes:
  ollama_models:
